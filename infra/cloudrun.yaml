apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reality-drift-backend
spec:
  template:
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/reality-drift-backend # Replace with actual project ID and image
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://USER:PASSWORD@HOST:PORT/DB_NAME" # Update with actual DB URL
        - name: OPENAI_API_KEY
          value: "your-openai-api-key" # Ideally manage this via Secret Manager
        - name: PORT
          value: "8080"
